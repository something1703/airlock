name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web engine (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint-and-fixtures:
    name: Invariant lint + fixture freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixtures regenerate byte-identically
        run: |
          python3 -I spec/tools/make_fixtures.py
          git diff --exit-code -- spec/fixtures
      - name: Invariant lint
        run: ./scripts/lint.sh

  swift:
    name: AirlockKit (swift test)
    runs-on: macos-26
    # GitHub's image has an older Xcode (26.6 / Swift 6.3) than local development (27.2 / 6.4): this job
    # proves the package still builds and passes on the older toolchain.
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: swift test
        working-directory: Packages/AirlockKit
        run: swift test

  functions:
    name: Firestore rules + Cloud Functions (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - name: Rules + functions against the Firestore emulator
        run: npx -y firebase-tools@15.36.0 emulators:exec --project demo-airlock --only firestore --config ../firebase/firebase.json "npx vitest run"

  android:
    name: Android (core + app tests, lint, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder Firebase config (the real one is gitignored)
        run: cp ci/google-services.ci.json app/google-services.json
      - name: Core conformance tests (spec/fixtures)
        run: ./gradlew :core:test --no-configuration-cache
      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --no-configuration-cache
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-configuration-cache
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache
